name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual run: rebuilds only the macOS DMG for the version in package.json and
  # attaches it to that version's existing release (e.g. after a failed mac job).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (skip native rebuild)
        run: npm install --ignore-scripts && node node_modules/electron/install.js

      - name: Build & publish (arm64 DMG)
        run: npx electron-vite build && npx electron-builder --mac --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder skips uploads to a release published >2h ago;
          # a manual run exists precisely to add to such a release.
          EP_GH_IGNORE_TIME: ${{ github.event_name == 'workflow_dispatch' }}

  build-win:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (skip native rebuild)
        run: npm install --ignore-scripts && node node_modules/electron/install.js

      - name: Build & publish (x64 installer)
        run: npx electron-vite build && npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
