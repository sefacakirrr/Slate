appId: com.slate.app
productName: Slate
copyright: Copyright © 2024 Sefa Gülenayva

publish:
  provider: github
  owner: sefacakirrr
  repo: Slate
  releaseType: release
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
# Real files (outside the asar) for the tray icon and toast notifications.
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
npmRebuild: true

mac:
  target:
    - target: dmg
  icon: resources/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.productivity
  darkModeSupport: true
  minimumSystemVersion: "12.0"
  identity: null
  # Lists Slate as an editor for text notes (Info.plist CFBundleDocumentTypes,
  # LSHandlerRank Alternate — never claims the default). Files arrive via the
  # app's open-file event. Windows registers the same types in
  # resources/installer.nsh (customInstall) instead: electron-builder's NSIS
  # fileAssociations would overwrite the user's default app for the extension.
  # No per-type `icon`: documents reuse the app icon. Pointing it at
  # resources/icon.icns re-copies that file onto Contents/Resources/icon.icns,
  # which fails with EEXIST on CI (hard-link copies) and broke the v0.1.16 DMG.
  fileAssociations:
    - ext: [md, markdown]
      name: Markdown document
      description: Markdown document
      role: Editor
      rank: Alternate
    - ext: txt
      name: Text document
      description: Text document
      role: Editor
      rank: Alternate

dmg:
  title: ${productName} ${version}
  background: null
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 185
    - x: 390
      y: 185
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-setup-${arch}.${ext}

nsis:
  oneClick: true
  allowElevation: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: Slate
  uninstallDisplayName: Slate

linux:
  target:
    - target: AppImage
      arch: x64
  icon: resources/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: Utility
